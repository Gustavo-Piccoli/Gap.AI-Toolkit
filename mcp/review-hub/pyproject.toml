[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "review-hub"
version = "0.1.0"
description = "CodeReviewHub: MCP server (MCPServer, mcp 2.x) for structured multi-agent code review threads."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gustavo Auad Piccoli" }]
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.6"]

[project.scripts]
review-hub = "review_hub:main"

[tool.setuptools]
py-modules = ["review_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["review_hub"]
